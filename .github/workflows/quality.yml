name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Lighthouse CI (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - name: Lighthouse CI (desktop)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
